# MVP-01, RUN-QA, RBOT-FEAT-011, RBOT-FEAT-018, RBOT-OPS-005, REQ-DEPLOYMENT-006, REQ-DEPLOYMENT-018, REQ-DEPLOYMENT-023
# RBOT-FEAT-018: адрес приложения несёт токен приглашения — в журнал пишется путь без строки запроса
log_format rbot_path '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
server {
  listen 8080 default_server;
  server_name qa.admin.yanapaderina.test;
  root /usr/share/nginx/admin;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location ^~ /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location = /actuator/health {
    proxy_pass http://backend:8080;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location ~* \.[a-z0-9]+$ {
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /index.html;
  }
}

server {
  listen 8080;
  server_name qa.bot.yanapaderina.test;
  access_log /var/log/nginx/access.log rbot_path;
  root /usr/share/nginx/bot;

