consent.text=Черновик, версия 1. Я соглашаюсь, что сервис записи к психологу обрабатывает мой идентификатор Telegram, подпись, которую дал мне психолог, и сведения о моих записях (дата, время, тип встречи), чтобы записывать меня на сессии, переносить и отменять их. Данные хранятся на сервере в России. Сообщения бота передаются через Telegram и сервер-посредник в Финляндии. Согласие можно отозвать, написав психологу.
