# MVP-01
name: rbot-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rbot
      POSTGRES_USER: rbot
      POSTGRES_PASSWORD: rbot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
volumes:
  postgres:
