# RBOT-OPS-020, RBOT-OPS-021, RBOT-OPS-024
scrape_configs:
  - job_name: "rbot-backend"
    metrics_path: "/metrics/rbot"
    scrape_interval: 30s
    scrape_timeout: 20s
    basic_auth:
      username: "prometheus"
      password_file: "/etc/prometheus/rbot-metrics.password"
    static_configs:
      - targets: ["127.0.0.1:19100"]
        labels:
          instance: "admin.yanapaderina.com"
          project: "rbot"
          environment: "production"
