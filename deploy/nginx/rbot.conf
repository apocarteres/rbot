# MVP-01, RBOT-FEAT-018, RBOT-OPS-020, RBOT-OPS-022, RBOT-OPS-005, RBOT-OPS-007, RBOT-OPS-008, REQ-DEPLOYMENT-018, REQ-DEPLOYMENT-020, REQ-DEPLOYMENT-022, REQ-DEPLOYMENT-023
include /etc/nginx/rbot-backend.conf;

# RBOT-OPS-020: метрики для Prometheus на metrics — только локально; на metrics их выносит обратный проброс туннеля rbot-monitoring-tunnel
server {
  listen 127.0.0.1:19100;
  server_name _;
  server_tokens off;
  access_log off;

  location = /metrics/rbot {
    auth_basic "rbot metrics";
    auth_basic_user_file /etc/nginx/rbot-metrics.htpasswd;
    proxy_pass http://rbot_backend/actuator/prometheus;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
  }

  location / {
    return 404;
  }
}

# RBOT-FEAT-018: адрес приложения несёт токен приглашения — в журнал пишется путь без строки запроса
log_format rbot_path '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  listen [::]:80;
  server_name admin.yanapaderina.com bot.yanapaderina.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.yanapaderina.com;

  ssl_certificate /etc/letsencrypt/live/admin.yanapaderina.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.yanapaderina.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;

  root /var/www/rbot/admin;
  server_tokens off;
  include /etc/nginx/snippets/rbot-headers.conf;

  location ^~ /api/ {
    proxy_pass http://rbot_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1m;
  }

  location ^~ /actuator/ {
    return 404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/rbot-headers.conf;
  }

  location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/rbot-headers.conf;
    try_files $uri @archive;
  }

  location @archive {
    root /var/www/rbot/archive/admin;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/rbot-headers.conf;
    try_files $uri =404;
  }

  location ~* \.[a-z0-9]+$ {
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/rbot-headers.conf;
    try_files $uri /index.html;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name bot.yanapaderina.com;

  ssl_certificate /etc/letsencrypt/live/bot.yanapaderina.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bot.yanapaderina.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;

  root /var/www/rbot/bot;
  server_tokens off;
  access_log /var/log/nginx/access.log rbot_path;
  include /etc/nginx/snippets/rbot-headers.conf;

  location ^~ /api/ {
    proxy_pass http://rbot_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1m;
  }

  location ^~ /actuator/ {
    return 404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/rbot-headers.conf;
  }

  location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/rbot-headers.conf;
    try_files $uri @archive;
  }

  location @archive {
    root /var/www/rbot/archive/bot;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/rbot-headers.conf;
    try_files $uri =404;
  }

  location ~* \.[a-z0-9]+$ {
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/rbot-headers.conf;
    try_files $uri /index.html;
  }
}
